# CI: runs when you push a version tag like v1.1
# 1. builds the Docker image  2. pushes it to Docker Hub with that version tag
# 3. updates the image tag in the deployment repo (which triggers the CD pipeline)
name: CI - build and push image

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile app.py

      - name: Work out image version (v1.1 becomes 1.1)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/notes-app:${{ env.VERSION }}

      - name: Get deployment repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/notes-app-deployment
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deployment

      - name: Update image tag in deployment repo
        working-directory: deployment
        run: |
          sed -i "s|image: .*notes-app:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/notes-app:${VERSION}|" k8s/06-app-deployment.yml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add k8s/06-app-deployment.yml
          git diff --cached --quiet || git commit -m "Deploy notes-app ${VERSION}"
          git push

